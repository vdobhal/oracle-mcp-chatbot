# =============================================================================
# ORACLE ATP - object allowlist
# =============================================================================
# This database runs in wildcard mode: every schema the connected account can
# read is reachable, discovered live from the data dictionary.
#
# Read this before changing it. Wildcard mode gives up layer 2 of the access
# model. The remaining layers still apply - role clearance, the SQL guardrails,
# row caps, timeouts and output masking - but the question of *which objects
# exist at all* is answered by the database grant rather than by this file.
#
# That makes the grant on ATP_USER load-bearing in a way it is not on On-Prem.
# It is only defensible while that account is genuinely read-only and scoped to
# reporting data. Verify with:
#
#   SELECT * FROM user_sys_privs;      -- expect CREATE SESSION and little else
#   SELECT * FROM user_role_privs;     -- DWROLE should NOT appear
#
# To go back to strict allowlisting, set allow_all_schemas to false and list
# schemas and objects the way config/policy/onprem.yaml does.
database: ATP
display_name: Oracle ATP
description: >-
  Autonomous Transaction Processing target of the On-Prem -> ATP integration.
  All schemas readable by the chatbot account are exposed.

allow_all_schemas: true

# Oracle's own schemas are excluded from discovery no matter what the account
# was granted; policy.ORACLE_INTERNAL_SCHEMAS covers the standard set and
# anything listed here is excluded on top of it.
excluded_schemas: []

# Objects referenced without a schema prefix resolve against the connected
# account's own schema.
default_schema: NAPP_READONLY

# No schemas are declared. Discovered objects carry no curated business
# description, and their columns are classified from the naming rules in
# masking.yaml rather than by a data steward. Declare an object here to give it
# a proper description and hand-assigned column sensitivity; declared entries
# take precedence over discovery.
schemas: []
