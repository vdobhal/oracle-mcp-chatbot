# =============================================================================
# ON-PREM ORACLE DB - object allowlist
# =============================================================================
# Nothing outside this file is reachable, regardless of what the database user
# is technically granted. This is the second of three independent access layers
# (DB grants -> this allowlist -> role clearance).
#
# This database is in strict allowlist mode: only the objects below are
# reachable. Adding an object here is a governance decision, so it goes through
# review rather than being discovered automatically. Every On-Prem object named
# in EIM_APPS.EIM_AI_LOOKUP_DETAILS is listed here so the routing catalog can
# actually be followed. CDM objects in that catalog live on ATP, not here.
database: ONPREM
display_name: On-Prem Oracle DB
description: >-
  EIM system of record. Product, system, install-base and sales-order reference
  data. Source side of the On-Prem -> ATP integration.

# An object referenced without a schema prefix resolves here.
default_schema: EIM

# Column lists are omitted deliberately. Columns are then read from the data
# dictionary at query time and classified by the naming rules in masking.yaml,
# so the allowlist stays accurate as these objects evolve. To pin a column set
# and hand-assign sensitivity, add a `columns:` block to that object; doing so
# switches it to declared mode and the dictionary is no longer consulted.
schemas:
  - name: EIM
    description: Enterprise Information Management source objects.
    business_domain: Product and Install Base
    objects:
      - name: EIM_PR_SYSTEM
        type: TABLE
        description: Registered systems and their current attributes.
        business_domain: Install Base
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_DRM_PRODUCT_DETAILS
        type: TABLE
        description: Product master detail sourced from DRM.
        business_domain: Product
        sensitivity: INTERNAL
        large_table: true
        require_filter: false

      - name: EIM_PR_SN_SO_REF
        type: TABLE
        description: >-
          Serial number to sales order cross-reference. The routing catalog
          requires EIM_STATUS = 'ACTIVE' on this object, and that rule applies
          here only. EIM_STATUS holds word codes on this table: ACTIVE,
          INACTIVE, DECOMISSIONED, INVALID.
        business_domain: Sales Order
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_PR_SN_SO_REF_PUB
        type: TABLE
        description: Published serial number to sales order cross-reference.
        business_domain: Sales Order
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_CONFIG_DETAILS
        type: TABLE
        description: >-
          Shelf and device configuration for a system, keyed by PRIMARY_SN.
          SOURCE distinguishes the feed: BKC and BKC_AIQ are ASUP-derived
          current config; SOURCE like ERP is as-sold config. One serial
          produces many rows (one per shelf/device line), not one header.
        business_domain: Install Base
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_PR_HEADSWAP
        type: TABLE
        description: >-
          Head-swap history. FROM_SERIAL_NUMBER is the old/failed serial;
          TO_SERIAL_NUMBER is the replacement. Do NOT filter EIM_STATUS =
          'ACTIVE' here - that rule belongs to EIM_PR_SN_SO_REF. On this table
          EIM_STATUS holds single-letter codes (S, E, H, N, C) and HS_STATUS is
          'C', so an 'ACTIVE' filter matches nothing and looks like the
          head-swap never happened. Query by serial alone.
        business_domain: Install Base
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_PR_IB_LATEST
        type: TABLE
        description: Latest install-base snapshot per system.
        business_domain: Install Base
        sensitivity: INTERNAL
        large_table: true
        require_filter: true

      - name: EIM_PR_ROLES
        type: TABLE
        description: Role assignments used by EIM processing.
        business_domain: Reference Data
        sensitivity: INTERNAL
        large_table: false
        require_filter: false

  - name: EIM_APPS
    description: EIM application metadata used to route AI questions.
    business_domain: Reference Data
    objects:
      - name: EIM_AI_LOOKUP_DETAILS
        type: TABLE
        description: >-
          Governed dataset-routing catalog for EIM, Install Base, CDM and CMAT
          questions. REFERENCE_TABLE identifies the candidate dataset, COMMENTS
          describes its purpose, KEY_COLUMNS gives the filter/join keys, and
          DB_TYPE plus DB_SCHEMA identify where it lives. On-Prem objects it
          names are allowlisted in this file; CDM objects it names live on ATP.
        business_domain: Reference Data
        sensitivity: INTERNAL
        large_table: false
        require_filter: false
